name: Ludo Paws Website Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check website against authoritative Play product contract
        env:
          LUDOPAWS_PLAY_CONTRACT: /tmp/ludopaws-play-contract.js
        run: |
          curl --fail --silent --show-error --retry 3 https://raw.githubusercontent.com/rekixo-lab/ludopaws/main/server/src/google-play-billing.js --output "$LUDOPAWS_PLAY_CONTRACT"
          node scripts/check-site.mjs
